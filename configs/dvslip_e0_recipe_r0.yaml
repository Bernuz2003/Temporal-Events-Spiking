experiment:
  name: dvslip_e0_recipe_r0
  seed: 42
  artifact_root: artifacts
  checkpoint_root: checkpoints
  deterministic: true

dataset:
  name: dvslip
  root: data/DVS-Lip/train
  split_manifest: data/dvslip_development_split.json
  batch_size: 4
  num_workers: 4
  pin_memory: true

representation:
  name: count_frames_e0
  window_us: 2000000
  bin_width_us: 50000
  count_cap: 255

augmentation:
  horizontal_flip_probability: 0.5

model:
  name: mini_qkformer
  in_channels: 2
  embed_dim: 128
  num_heads: 8
  mlp_ratio: 2.0
  lif_tau: 2.0
  lif_threshold: 1.0

training:
  recipe_id: dvslip_e0_r0
  epochs: 64
  optimizer: adamw
  learning_rate: 0.0003
  min_learning_rate: 0.000001
  scheduler: cosine
  warmup_epochs: 4
  warmup_start_factor: 0.01
  weight_decay: 0.0005
  label_smoothing: 0.1
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 8
  amp: true
  select_metric: macro_f1
  evaluate_holdout: false

profiling:
  enabled: true
  max_batches: 8
  mac_energy_pj: 4.6
  ac_energy_pj: 0.9
