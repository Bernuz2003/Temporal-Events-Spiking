extends: dvslip_predictive_continuation_base.yaml

experiment:
  name: dvslip_predictive_coarse_future

model:
  predictive_head: true
  predictive_head_spatial_kernel_size: 3
  predictive_head_hidden_channels: 128

predictive:
  blocked_reason: >-
    Suspended by the phase-1 audit. The coarse future target is feasible (affine R2 0.249 at
    h=2, 3.6x the fine target) and h=2 is retained, but its gradient authority and direction
    were never measured and it acts on stage1, where A2 finds little class information. To
    reopen: rerun the h=2 probe on the launch commit into normalization_report, and decide in
    light of the from-scratch S0 result.
  teacher_config: configs/dvslip_f_tcap_stage1_dwc3_d8.yaml
  teacher_checkpoint: checkpoints/dvslip_f_tcap_stage1_dwc3_d8__20260914_093427_434930__seed42/best.pt
  objective:
    mode: coarse_future
    weight: 0.1
    ramp_epochs: 4
    horizon_steps: 2
    alignment_horizon_steps: 2
    normalization_report: artifacts/predictive_diagnostics/coarse_future_probe.json
